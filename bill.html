<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ແອບສະແດງ ແລະ ແກ້ໄຂຮູບພາບ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Noto Sans Lao -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#06b6d4',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans Lao', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans Lao', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom Glowing & Vibrant Styles */
        .glass-panel {
            background: rgba(8, 25, 55, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-gradient-primary {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #0ea5e9 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }
        .btn-gradient-primary:active {
            transform: scale(0.96);
        }
        .btn-gradient-success {
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .image-glow {
            box-shadow: 0 0 35px rgba(14, 165, 233, 0.22);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-950 text-slate-100 h-screen w-screen flex flex-col justify-between overflow-hidden">

    <!-- Header Navigation -->
    <header class="z-30 glass-panel px-4 py-3 flex items-center justify-between shrink-0 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-700 via-blue-600 to-sky-300 p-0.5 shadow-lg shadow-blue-500/30 flex items-center justify-center">
                <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-photo-film text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-sky-300 text-lg"></i>
                </div>
            </div>
            <div>
                <h1 class="font-bold text-sm leading-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-sky-200">ສະແດງຮູບພາບ</h1>
                <p id="imageCounter" class="text-[10px] font-medium text-sky-300/80">ຮູບທີ 1 / 1</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleUrlBar()" class="w-9 h-9 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 rounded-xl text-xs transition active:scale-95 flex items-center justify-center shadow" title="ປ່ຽນ URL">
                <i class="fa-solid fa-link text-sky-300"></i>
            </button>
            <button onclick="openEditorDirect(currentIndex)" class="btn-gradient-primary text-white px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition active:scale-95">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i> ແກ້ໄຂ
            </button>
            <button onclick="downloadCurrentImage()" class="w-9 h-9 bg-slate-800/80 hover:bg-slate-700/80 text-sky-300 rounded-xl flex items-center justify-center border border-white/10 transition active:scale-95 shadow">
                <i class="fa-solid fa-download text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Collapsible URL Input Bar -->
    <section id="urlBarContainer" class="hidden glass-panel border-t-0 px-4 py-2.5 text-xs shrink-0 transition-all duration-300">
        <div class="flex items-center gap-2 max-w-md mx-auto bg-slate-950/80 border border-blue-500/30 rounded-xl p-1.5 shadow-inner">
            <i class="fa-solid fa-link text-sky-400 pl-2"></i>
            <input type="text" id="customUrlInput" placeholder="https://banhomdev.github.io/Tracking/bill?url=..." 
                   class="bg-transparent text-slate-200 text-xs w-full focus:outline-none placeholder-slate-500">
            <button onclick="loadFromCustomUrl()" class="bg-gradient-to-r from-blue-600 to-sky-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium hover:brightness-110 transition active:scale-95 shrink-0 shadow">
                ດຶງຮູບ
            </button>
        </div>
    </section>

    <!-- MAIN VIEWPORT: Single Full-Screen Image Container -->
    <main class="flex-1 relative flex items-center justify-center overflow-hidden touch-none p-2" id="zoomContainer">
        <!-- Background Decorative Blur Orbs -->
        <div class="absolute w-72 h-72 bg-blue-600/20 rounded-full blur-3xl -top-10 -left-10 pointer-events-none"></div>
        <div class="absolute w-72 h-72 bg-sky-500/15 rounded-full blur-3xl -bottom-10 -right-10 pointer-events-none"></div>

        <!-- Toast / Notification Alert -->
        <div id="toast" class="hidden absolute top-4 z-40 glass-panel border-blue-500/40 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center space-x-2.5 text-xs transition-all duration-300 pointer-events-none">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
            <span id="toastMsg" class="font-medium">ສຳເລັດ</span>
        </div>

        <!-- Single Full Screen Image Display -->
        <div class="relative max-h-full max-w-full flex items-center justify-center">
            <img id="mainDisplayImg" src="" alt="Full Screen Display" 
                 class="max-h-[82vh] max-w-full object-contain rounded-2xl image-glow border border-white/10 transition-transform duration-100 ease-out cursor-grab active:cursor-grabbing select-none"
                 onerror="this.src='https://placehold.co/600x800/1e1b4b/ffffff?text=Image+Error'">
        </div>
    </main>

    <!-- Bottom Controls Overlay Bar -->
    <footer class="z-30 glass-panel border-b-0 p-3 flex flex-col items-center gap-3 shrink-0 shadow-2xl">
        <!-- Zoom Level & Reset Controls -->
        <div class="flex items-center space-x-4 bg-slate-950/80 border border-blue-500/30 px-5 py-1.5 rounded-full shadow-inner">
            <button onclick="adjustZoom(-0.25)" class="text-sky-400 hover:text-sky-300 p-1 text-sm transition active:scale-90"><i class="fa-solid fa-minus"></i></button>
            <span id="zoomLevelText" class="text-xs font-mono font-semibold text-sky-200 w-12 text-center">100%</span>
            <button onclick="adjustZoom(0.25)" class="text-sky-300 hover:text-sky-200 p-1 text-sm transition active:scale-90"><i class="fa-solid fa-plus"></i></button>
            <button onclick="resetZoom()" class="text-xs font-medium text-blue-300 pl-3 border-l border-slate-700 hover:text-white transition">ຣີເຊັດ</button>
        </div>

        <!-- Next / Prev Navigation Buttons -->
        <div class="w-full flex justify-between items-center max-w-sm px-2 gap-3">
            <button onclick="prevImage()" class="flex-1 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 text-slate-200 px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 active:scale-95 shadow-md transition">
                <i class="fa-solid fa-chevron-left text-sky-400"></i> ຮູບກ່ອນໜ້າ
            </button>
            <button onclick="nextImage()" class="flex-1 bg-slate-800/80 hover:bg-slate-700/80 border border-white/10 text-slate-200 px-4 py-2.5 rounded-2xl text-xs font-semibold flex items-center justify-center gap-2 active:scale-95 shadow-md transition">
                ຮູບຕໍ່ໄປ <i class="fa-solid fa-chevron-right text-sky-300"></i>
            </button>
        </div>
    </footer>

    <!-- ========================================== -->
    <!-- MODAL: PHOTO EDITOR ( canvas-based )      -->
    <!-- ========================================== -->
    <div id="editorModal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl hidden flex flex-col">
        <!-- Editor Header -->
        <div class="p-3.5 glass-panel flex justify-between items-center shrink-0 border-b border-white/10">
            <button onclick="closeEditor()" class="text-slate-300 hover:text-white px-3 py-1.5 rounded-lg bg-slate-800/60 border border-white/5 text-xs font-medium flex items-center gap-1.5 transition active:scale-95">
                <i class="fa-solid fa-arrow-left text-sky-400"></i> ຍົກເລີກ
            </button>
            <h2 class="text-xs sm:text-sm font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-sky-300">ເຄື່ອງມືແກ້ໄຂຮູບພາບ</h2>
            <button onclick="saveEditedImage()" class="btn-gradient-success text-white px-4 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 active:scale-95 shadow">
                <i class="fa-solid fa-floppy-disk"></i> ບັນທຶກ
            </button>
        </div>

        <!-- Editor Canvas Viewport -->
        <div class="flex-1 bg-slate-950 flex items-center justify-center p-4 overflow-hidden relative">
            <canvas id="editorCanvas" class="max-w-full max-h-full object-contain shadow-2xl rounded-xl border border-white/10"></canvas>
        </div>

        <!-- Editor Controls Navigation Tabs -->
        <div class="glass-panel border-t border-white/10 flex flex-col shrink-0">
            <!-- Dynamic Controls Section -->
            <div class="p-4 border-b border-white/5 min-h-[105px] flex items-center justify-center" id="editorToolOptions">
                <!-- Rotate Tools (Default) -->
                <div id="tool-rotate" class="editor-subtool flex items-center justify-center space-x-6 w-full">
                    <button onclick="rotateImage(-90)" class="flex flex-col items-center text-slate-300 hover:text-sky-300 text-xs gap-1.5 transition">
                        <div class="w-11 h-11 rounded-2xl bg-slate-800/80 flex items-center justify-center text-base border border-blue-500/30 text-sky-300 shadow-lg"><i class="fa-solid fa-rotate-left"></i></div>
                        ໝູນຊ້າຍ
                    </button>
                    <button onclick="rotateImage(90)" class="flex flex-col items-center text-slate-300 hover:text-sky-300 text-xs gap-1.5 transition">
                        <div class="w-11 h-11 rounded-2xl bg-slate-800/80 flex items-center justify-center text-base border border-blue-500/30 text-sky-300 shadow-lg"><i class="fa-solid fa-rotate-right"></i></div>
                        ໝູນຂວາ
                    </button>
                    <button onclick="flipImage('h')" class="flex flex-col items-center text-slate-300 hover:text-sky-400 text-xs gap-1.5 transition">
                        <div class="w-11 h-11 rounded-2xl bg-slate-800/80 flex items-center justify-center text-base border border-blue-500/30 text-sky-400 shadow-lg"><i class="fa-solid fa-arrows-left-right"></i></div>
                        ພິກຊ້າຍ-ຂວາ
                    </button>
                    <button onclick="flipImage('v')" class="flex flex-col items-center text-slate-300 hover:text-sky-400 text-xs gap-1.5 transition">
                        <div class="w-11 h-11 rounded-2xl bg-slate-800/80 flex items-center justify-center text-base border border-blue-500/30 text-sky-400 shadow-lg"><i class="fa-solid fa-arrows-up-down"></i></div>
                        ພິກເທິງ-ລຸ່ມ
                    </button>
                </div>

                <!-- Adjust Sliders -->
                <div id="tool-adjust" class="editor-subtool hidden w-full max-w-xs space-y-2.5">
                    <div>
                        <div class="flex justify-between text-[11px] font-medium text-slate-300 mb-1">
                            <span>ຄວາມສະຫວ່າງ (Brightness)</span>
                            <span id="valBrightness" class="text-sky-300">100%</span>
                        </div>
                        <input type="range" id="sliderBrightness" min="0" max="200" value="100" oninput="applyFilters()" class="w-full accent-sky-400 h-1.5 bg-slate-800 rounded-lg">
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] font-medium text-slate-300 mb-1">
                            <span>ຄອນທຣາດ (Contrast)</span>
                            <span id="valContrast" class="text-sky-400">100%</span>
                        </div>
                        <input type="range" id="sliderContrast" min="0" max="200" value="100" oninput="applyFilters()" class="w-full accent-sky-500 h-1.5 bg-slate-800 rounded-lg">
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] font-medium text-slate-300 mb-1">
                            <span>ຄວາມເຂັ້ມສີ (Saturation)</span>
                            <span id="valSaturation" class="text-blue-300">100%</span>
                        </div>
                        <input type="range" id="sliderSaturation" min="0" max="200" value="100" oninput="applyFilters()" class="w-full accent-blue-500 h-1.5 bg-slate-800 rounded-lg">
                    </div>
                </div>

                <!-- Filters Preset -->
                <div id="tool-filter" class="editor-subtool hidden flex space-x-3 overflow-x-auto py-1 w-full hide-scrollbar">
                    <button onclick="setFilterPreset('none')" class="flex-shrink-0 bg-slate-800/90 p-2.5 rounded-xl text-center text-xs text-slate-200 w-20 border border-white/10 hover:border-sky-400 transition">ປົກຕິ</button>
                    <button onclick="setFilterPreset('grayscale')" class="flex-shrink-0 bg-slate-800/90 p-2.5 rounded-xl text-center text-xs text-slate-200 w-20 border border-white/10 hover:border-sky-400 transition">ຂາວ-ດຳ</button>
                    <button onclick="setFilterPreset('sepia')" class="flex-shrink-0 bg-slate-800/90 p-2.5 rounded-xl text-center text-xs text-slate-200 w-20 border border-white/10 hover:border-sky-400 transition">ຊີເປຍ (Sepia)</button>
                    <button onclick="setFilterPreset('vintage')" class="flex-shrink-0 bg-slate-800/90 p-2.5 rounded-xl text-center text-xs text-slate-200 w-20 border border-white/10 hover:border-sky-400 transition">ບູຮານ (Vintage)</button>
                    <button onclick="setFilterPreset('invert')" class="flex-shrink-0 bg-slate-800/90 p-2.5 rounded-xl text-center text-xs text-slate-200 w-20 border border-white/10 hover:border-sky-400 transition">ກັບສີ (Invert)</button>
                </div>

                <!-- Text Overlay Tool -->
                <div id="tool-text" class="editor-subtool hidden w-full max-w-xs space-y-2">
                    <input type="text" id="editorTextInput" placeholder="ພິມຂໍ້ຄວາມຢູ່ຮູບພາບ..." class="w-full bg-slate-900 border border-blue-500/40 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-sky-400">
                    <div class="flex gap-2">
                        <input type="color" id="editorTextColor" value="#ffffff" class="w-10 h-9 bg-slate-900 border border-blue-500/40 rounded-xl cursor-pointer p-0.5">
                        <button onclick="addTextToCanvas()" class="flex-1 bg-gradient-to-r from-blue-700 to-sky-500 text-white rounded-xl text-xs font-semibold hover:brightness-110 active:scale-95 transition shadow">
                            ເພີ່ມຂໍ້ຄວາມ
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bottom Tool Category Selection -->
            <div class="flex justify-around py-2.5 text-xs text-slate-400 bg-slate-950/90 border-t border-white/5">
                <button onclick="switchEditorTool('rotate')" id="tab-rotate" class="tool-tab flex flex-col items-center py-1 px-3 text-sky-300 font-semibold">
                    <i class="fa-solid fa-rotate text-base mb-1"></i>
                    ໝູນ/ພິກ
                </button>
                <button onclick="switchEditorTool('adjust')" id="tab-adjust" class="tool-tab flex flex-col items-center py-1 px-3 hover:text-white transition">
                    <i class="fa-solid fa-sliders text-base mb-1"></i>
                    ປັບສີ
                </button>
                <button onclick="switchEditorTool('filter')" id="tab-filter" class="tool-tab flex flex-col items-center py-1 px-3 hover:text-white transition">
                    <i class="fa-solid fa-wand-magic-sparkles text-base mb-1"></i>
                    ຟິວເຕີ
                </button>
                <button onclick="switchEditorTool('text')" id="tab-text" class="tool-tab flex flex-col items-center py-1 px-3 hover:text-white transition">
                    <i class="fa-solid fa-font text-base mb-1"></i>
                    ຂໍ້ຄວາມ
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC                           -->
    <!-- ========================================== -->
    <script>
        const BASE_TRACKING_URL = 'https://banhomdev.github.io/Tracking/bill?url=';

        const sampleImageUrls = []; // ບໍ່ໃຊ້ຮູບຕົວຢ່າງ; ດຶງຮູບຈາກ URL ທີ່ຜູ້ໃຊ້ສົ່ງ

        let galleryItems = [];
        let currentIndex = 0;

        // Zoom / Pan state
        let currentZoom = 1;
        let isDragging = false;
        let startX = 0, startY = 0;
        let translateX = 0, translateY = 0;

        // Canvas state
        let editorCanvas, editorCtx;
        let loadedImgElement = new Image();
        let editorState = {
            rotation: 0,
            flipH: 1,
            flipV: 1,
            brightness: 100,
            contrast: 100,
            saturation: 100,
            filterPreset: 'none',
            texts: []
        };

        window.onload = function() {
            initViewer();
            setupTouchAndPan();
        };

        function initViewer() {
            galleryItems = [];
            const params = new URLSearchParams(window.location.search);
            const incomingUrl = params.get('url');
            if (incomingUrl) {
                addImageFromUrl(incomingUrl, false);
            } else {
                showEmptyViewer();
            }
        }

        function showEmptyViewer() {
            const imgEl = document.getElementById('mainDisplayImg');
            imgEl.src = 'https://placehold.co/900x1200/0b1f45/93c5fd?text=Paste+Tracking+Bill+URL';
            imgEl.style.transform = 'none';
            document.getElementById('imageCounter').innerText = 'ຍັງບໍ່ມີຮູບພາບ';
            document.getElementById('zoomLevelText').innerText = '100%';
        }

        function extractImageUrl(input) {
            const raw = String(input || '').trim();
            if (!raw) return '';
            try {
                const parsed = new URL(raw, window.location.href);
                if (parsed.pathname.toLowerCase().includes('/bill')) {
                    const imageUrl = parsed.searchParams.get('url');
                    if (imageUrl) return imageUrl;
                }
                if (parsed.searchParams.has('url')) {
                    const imageUrl = parsed.searchParams.get('url');
                    if (imageUrl) return imageUrl;
                }
            } catch (e) {}
            return raw;
        }

        function addImageFromUrl(input, notify = true) {
            const directUrl = extractImageUrl(input);
            if (!directUrl || !/^https?:\/\//i.test(directUrl)) {
                showToast('URL ບໍ່ຖືກຕ້ອງ ຫຼື ບໍ່ພົບລິງຮູບພາບ', 'error');
                return false;
            }
            const item = {
                id: Date.now(),
                trackingUrl: input,
                directUrl,
                title: `ຮູບພາບ ${galleryItems.length + 1}`
            };
            galleryItems.unshift(item);
            currentIndex = 0;
            displayCurrentImage();
            if (notify) showToast('ເພີ່ມລິງຮູບພາບສຳເລັດ');
            return true;
        }

        function displayCurrentImage() {
            if (!galleryItems.length) {
                showEmptyViewer();
                return;
            }
            const item = galleryItems[currentIndex];
            const imgEl = document.getElementById('mainDisplayImg');
            imgEl.onerror = function() {
                showToast('ໂຫຼດຮູບບໍ່ສຳເລັດ: ກວດສອບລິງຮູບພາບ', 'error');
                this.src = 'https://placehold.co/900x1200/0b1f45/93c5fd?text=Image+Load+Error';
            };
            imgEl.src = item.directUrl;
            document.getElementById('imageCounter').innerText = `ຮູບທີ ${currentIndex + 1} / ${galleryItems.length}`;
            resetZoom();
        }

        function toggleUrlBar() {
            const urlBar = document.getElementById('urlBarContainer');
            urlBar.classList.toggle('hidden');
        }

        function loadFromCustomUrl() {
            const input = document.getElementById('customUrlInput').value.trim();
            if (!input) {
                showToast('ກະລຸນາວາງລິງ bill?url=... ຫຼື ລິງຮູບພາບ', 'error');
                return;
            }
            if (addImageFromUrl(input, true)) {
                document.getElementById('customUrlInput').value = '';
                document.getElementById('urlBarContainer').classList.add('hidden');
            }
        }

        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = galleryItems.length - 1;
            }
            displayCurrentImage();
        }

        function nextImage() {
            if (currentIndex < galleryItems.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            displayCurrentImage();
        }

        // Zoom Functions
        function adjustZoom(amount) {
            currentZoom = Math.max(0.5, Math.min(4, currentZoom + amount));
            applyZoomTransform();
        }

        function resetZoom() {
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            applyZoomTransform();
        }

        function applyZoomTransform() {
            const img = document.getElementById('mainDisplayImg');
            document.getElementById('zoomLevelText').innerText = `${Math.round(currentZoom * 100)}%`;
            img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
        }

        // Touch & Pan Event Support
        function setupTouchAndPan() {
            const container = document.getElementById('zoomContainer');

            container.addEventListener('mousedown', (e) => {
                if (currentZoom > 1) {
                    isDragging = true;
                    startX = e.clientX - translateX;
                    startY = e.clientY - translateY;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    translateX = e.clientX - startX;
                    translateY = e.clientY - startY;
                    applyZoomTransform();
                }
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && currentZoom > 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - translateX;
                    startY = e.touches[0].clientY - translateY;
                }
            });

            container.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    translateX = e.touches[0].clientX - startX;
                    translateY = e.touches[0].clientY - startY;
                    applyZoomTransform();
                }
            });

            container.addEventListener('touchend', () => { isDragging = false; });
        }

        // Download functionality
        function downloadCurrentImage() {
            const item = galleryItems[currentIndex];
            showToast('ກຳລັງດາວໂຫຼດຮູບພາບ...');
            fetch(item.directUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = `photo-${currentIndex + 1}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    showToast('ດາວໂຫຼດຮູບພາບສຳເລັດ!');
                })
                .catch(() => {
                    window.open(item.directUrl, '_blank');
                    showToast('ເປີດຮູບພາບໃນ Tap ໃໝ່ເພື່ອບັນທຶກ', 'info');
                });
        }

        // Editor Functions
        function openEditorDirect(index) {
            currentIndex = index;
            const item = galleryItems[currentIndex];

            editorCanvas = document.getElementById('editorCanvas');
            editorCtx = editorCanvas.getContext('2d');

            editorState = {
                rotation: 0,
                flipH: 1,
                flipV: 1,
                brightness: 100,
                contrast: 100,
                saturation: 100,
                filterPreset: 'none',
                texts: []
            };

            document.getElementById('sliderBrightness').value = 100;
            document.getElementById('sliderContrast').value = 100;
            document.getElementById('sliderSaturation').value = 100;
            document.getElementById('valBrightness').innerText = '100%';
            document.getElementById('valContrast').innerText = '100%';
            document.getElementById('valSaturation').innerText = '100%';
            document.getElementById('editorTextInput').value = '';

            loadedImgElement = new Image();
            loadedImgElement.crossOrigin = "anonymous";
            loadedImgElement.onload = function() {
                renderEditorCanvas();
                document.getElementById('editorModal').classList.remove('hidden');
            };
            loadedImgElement.src = item.directUrl;
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.add('hidden');
        }

        function switchEditorTool(toolName) {
            document.querySelectorAll('.editor-subtool').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tool-tab').forEach(el => {
                el.classList.remove('text-sky-300', 'font-semibold');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`tool-${toolName}`).classList.remove('hidden');
            const activeTab = document.getElementById(`tab-${toolName}`);
            activeTab.classList.remove('text-slate-400');
            activeTab.classList.add('text-sky-300', 'font-semibold');
        }

        function rotateImage(deg) {
            editorState.rotation = (editorState.rotation + deg) % 360;
            renderEditorCanvas();
        }

        function flipImage(dir) {
            if (dir === 'h') editorState.flipH *= -1;
            if (dir === 'v') editorState.flipV *= -1;
            renderEditorCanvas();
        }

        function applyFilters() {
            editorState.brightness = document.getElementById('sliderBrightness').value;
            editorState.contrast = document.getElementById('sliderContrast').value;
            editorState.saturation = document.getElementById('sliderSaturation').value;

            document.getElementById('valBrightness').innerText = `${editorState.brightness}%`;
            document.getElementById('valContrast').innerText = `${editorState.contrast}%`;
            document.getElementById('valSaturation').innerText = `${editorState.saturation}%`;

            renderEditorCanvas();
        }

        function setFilterPreset(preset) {
            editorState.filterPreset = preset;
            renderEditorCanvas();
        }

        function addTextToCanvas() {
            const text = document.getElementById('editorTextInput').value.trim();
            const color = document.getElementById('editorTextColor').value;
            if (text) {
                editorState.texts.push({ text, color });
                renderEditorCanvas();
                document.getElementById('editorTextInput').value = '';
                showToast('ເພີ່ມຂໍ້ຄວາມແລ້ວ');
            }
        }

        function renderEditorCanvas() {
            if (!loadedImgElement.width) return;

            const rad = (editorState.rotation * Math.PI) / 180;
            const isSwapped = Math.abs(editorState.rotation) === 90 || Math.abs(editorState.rotation) === 270;

            const origW = loadedImgElement.width;
            const origH = loadedImgElement.height;

            editorCanvas.width = isSwapped ? origH : origW;
            editorCanvas.height = isSwapped ? origW : origH;

            editorCtx.save();

            editorCtx.translate(editorCanvas.width / 2, editorCanvas.height / 2);
            editorCtx.rotate(rad);
            editorCtx.scale(editorState.flipH, editorState.flipV);

            let filterString = `brightness(${editorState.brightness}%) contrast(${editorState.contrast}%) saturate(${editorState.saturation}%)`;
            
            if (editorState.filterPreset === 'grayscale') filterString += ' grayscale(100%)';
            if (editorState.filterPreset === 'sepia') filterString += ' sepia(100%)';
            if (editorState.filterPreset === 'invert') filterString += ' invert(100%)';
            if (editorState.filterPreset === 'vintage') filterString += ' sepia(50%) contrast(120%) brightness(90%)';

            editorCtx.filter = filterString;
            editorCtx.drawImage(loadedImgElement, -origW / 2, -origH / 2, origW, origH);
            editorCtx.restore();

            if (editorState.texts.length > 0) {
                editorCtx.save();
                const fontSize = Math.max(24, Math.floor(editorCanvas.width / 20));
                editorCtx.font = `bold ${fontSize}px "Noto Sans Lao", sans-serif`;
                editorCtx.textAlign = 'center';

                editorState.texts.forEach((item, index) => {
                    editorCtx.fillStyle = item.color;
                    editorCtx.shadowColor = 'black';
                    editorCtx.shadowBlur = 8;
                    const yPos = (editorCanvas.height / 2) + (index * (fontSize + 10));
                    editorCtx.fillText(item.text, editorCanvas.width / 2, yPos);
                });
                editorCtx.restore();
            }
        }

        function saveEditedImage() {
            try {
                const dataUrl = editorCanvas.toDataURL('image/jpeg', 0.95);
                
                galleryItems.unshift({
                    id: galleryItems.length,
                    trackingUrl: `${BASE_TRACKING_URL}edited_photo`,
                    directUrl: dataUrl,
                    title: `ຮູບແກ້ໄຂ`
                });

                currentIndex = 0;
                displayCurrentImage();

                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `edited-photo-${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                closeEditor();
                showToast('ບັນທຶກ ແລະ ດາວໂຫຼດຮູບແກ້ໄຂແລ້ວ!');
            } catch (err) {
                showToast('ບໍ່ສາມາດບັນທຶກຮູບໄດ້ (Security CORS restriction)', 'error');
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-green-400';
            }

            toast.classList.remove('hidden');
            toast.style.opacity = '1';

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }
    </script>
</body>
</html>
