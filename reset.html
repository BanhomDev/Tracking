<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter & Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Background Mesh Effect */
        .bg-mesh {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(204, 251, 241, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(224, 231, 255, 0.6) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh text-slate-700 min-h-screen flex items-center justify-center p-5">

    <!-- Container หลัก ออกแบบมินิมอลสำหรับมือถือ -->
    <div class="w-full max-w-sm bg-white/80 backdrop-blur-md rounded-3xl p-7 shadow-xl shadow-slate-200/60 border border-slate-100 flex flex-col justify-between min-h-[480px]">
        
        <!-- Header Section -->
        <div class="text-center mt-2">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-teal-50 text-teal-600 rounded-2xl mb-4 border border-teal-100">
                <i class="fa-solid fa-lock text-xl"></i>
            </div>
            <h1 class="text-xl font-medium text-slate-800 mb-1">ยินดีต้อนรับ</h1>
            <p class="text-slate-400 text-xs">กรุณากรอกรหัสผ่านเพื่อดำเนินการต่อ</p>
            
            <!-- แสดงเบอร์โทรศัพท์ในหน้าล็อกอิน -->
            <div id="phoneBadge" class="mt-3 inline-flex items-center gap-2 px-3 py-1.5 bg-slate-100 border border-slate-200/60 rounded-full text-slate-600 text-xs font-mono">
                <i class="fa-solid fa-phone text-[10px] text-teal-600"></i>
                <span id="loginPhoneDisplay" class="font-medium tracking-wide">--</span>
            </div>
        </div>

        <!-- Form Section -->
        <div class="my-auto py-4">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-500 mb-2 pl-1">
                        รหัสผ่าน
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            required 
                            autofocus
                            placeholder="กรอกรหัสผ่าน"
                            class="w-full pl-4 pr-11 py-3.5 bg-slate-50/80 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 text-slate-800 placeholder-slate-400 text-sm transition-all duration-200"
                        >
                        <button 
                            type="button" 
                            onclick="togglePasswordVisibility()" 
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                            aria-label="แสดง/ซ่อนรหัสผ่าน"
                        >
                            <i id="toggleIcon" class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- แสดงข้อความผิดพลาด -->
                <div id="errorMessage" class="hidden text-rose-500 text-xs bg-rose-50/80 border border-rose-100 rounded-xl p-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-sm flex-shrink-0"></i>
                    <span id="errorText">รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง</span>
                </div>

                <!-- ปุ่มเข้าสู่ระบบ -->
                <button 
                    type="submit" 
                    class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white font-medium rounded-2xl shadow-md shadow-teal-600/20 transition-all duration-200 flex items-center justify-center gap-2 text-sm mt-2"
                >
                    <span>ยืนยัน</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <!-- หน้าจอสำเร็จ (จะซ่อนไว้ก่อน) -->
        <div id="successCard" class="hidden text-center py-4 my-auto space-y-4">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-50 text-emerald-500 rounded-2xl border border-emerald-100">
                <i class="fa-solid fa-check text-2xl"></i>
            </div>
            <div>
                <h2 class="text-xl font-medium text-slate-800">เข้าสู่ระบบเรียบร้อย</h2>
                <p class="text-xs text-slate-400 mt-1">การยืนยันตัวตนเสร็จสมบูรณ์</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <p class="text-slate-400 text-[11px] mb-1">เบอร์โทรศัพท์ของคุณ</p>
                <p id="fullPhoneDisplay" class="font-mono text-lg font-semibold text-teal-700 tracking-wider">--</p>
            </div>
            <button 
                onclick="resetApp()" 
                class="w-full py-3 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600 font-medium rounded-xl transition-all duration-200 text-xs"
            >
                ย้อนกลับ
            </button>
        </div>

        <!-- Footer -->
        <div class="text-center text-[11px] text-slate-400 pt-3 border-t border-slate-100">
            <p>ระบบรักษาความปลอดภัย</p>
        </div>

    </div>

    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase project configuration
        const SUPABASE_URL = "https://ubipbzilvjxlpbpbmlhf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ1YmlwYnppbml2aHBicGJtbGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzkwMTEsImV4cCI6MjEwODg1NTAxMX0.571h8hPcnUg5AlBzhZt8pajfCece91AMIbFXwmZNL_w";

        // รหัสยืนยัน และรหัสผ่านใหม่ที่กำหนด
        const CORRECT_PASSWORD = "12345678ranya$$$";
        const RESET_PASSWORD = "1234";
        const LOCK_DURATION_MS = 6 * 60 * 60 * 1000;
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let phoneNumber = "";

        function lockKey() {
            return "reset_lock_v1_" + phoneNumber;
        }

        function getLockUntil() {
            return Number(localStorage.getItem(lockKey()) || 0);
        }

        function formatRemaining(ms) {
            const totalSeconds = Math.ceil(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${hours} ชั่วโมง ${minutes} นาที ${seconds} วินาที`;
        }

        function updateLockUI() {
            const until = getLockUntil();
            const remaining = until - Date.now();
            const input = document.getElementById("password");
            const submit = document.querySelector('#loginForm button[type="submit"]');
            if (remaining > 0) {
                input.disabled = true;
                submit.disabled = true;
                submit.classList.add("opacity-50", "cursor-not-allowed");
                showError("อุปกรณ์นี้ถูกล็อกชั่วคราว กรุณาลองใหม่ในอีก " + formatRemaining(remaining));
                return true;
            }
            input.disabled = false;
            submit.disabled = false;
            submit.classList.remove("opacity-50", "cursor-not-allowed");
            return false;
        }

        function showError(message) {
            const box = document.getElementById("errorMessage");
            document.getElementById("errorText").textContent = message;
            box.classList.remove("hidden");
        }

        function hideError() {
            document.getElementById("errorMessage").classList.add("hidden");
            document.getElementById("password").classList.remove("border-rose-500");
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            phoneNumber = params.get("phone") || params.get("tel") || params.get("p") || "";
            document.getElementById("loginPhoneDisplay").textContent =
                phoneNumber || "ไม่ระบุเบอร์โทรศัพท์";
            updateLockUI();
            if (!document.getElementById("password").disabled) {
                document.getElementById("password").focus();
            }
        };

        function togglePasswordVisibility() {
            const input = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function formatLocalDateTime(date) {
            const pad = n => String(n).padStart(2, "0");
            return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ` +
                   `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        async function handleLogin(event) {
            event.preventDefault();
            if (updateLockUI()) return;

            const input = document.getElementById("password");
            const enteredPassword = input.value;

            if (enteredPassword !== CORRECT_PASSWORD) {
                localStorage.setItem(lockKey(), String(Date.now() + LOCK_DURATION_MS));
                input.value = "";
                input.classList.add("border-rose-500");
                showError("รหัสผ่านไม่ถูกต้อง อุปกรณ์นี้ถูกล็อกเป็นเวลา 6 ชั่วโมง");
                updateLockUI();
                return;
            }

            if (!/^\d{8}$/.test(phoneNumber)) {
                showError("ไม่พบเบอร์โทรศัพท์ 8 หลักในลิงก์ กรุณาตรวจสอบลิงก์อีกครั้ง");
                return;
            }

            const submit = document.querySelector('#loginForm button[type="submit"]');
            submit.disabled = true;
            submit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>กำลังดำเนินการ...</span>';
            hideError();

            try {
                const newDate = formatLocalDateTime(new Date());

                // อัปเดตเฉพาะแถวที่ userid ตรงกับเบอร์โทรศัพท์ 8 หลัก
                const { data, error } = await supabase
                    .from("user")
                    .update({ password: RESET_PASSWORD, date: newDate })
                    .eq("userid", phoneNumber)
                    .select("userid");

                if (error) throw error;

                if (!data || data.length === 0) {
                    showError("ไม่พบเบอร์โทรศัพท์นี้ในระบบ หรือไม่มีสิทธิ์แก้ไขข้อมูล");
                    return;
                }

                document.getElementById("loginForm").parentElement.classList.add("hidden");
                document.getElementById("successCard").classList.remove("hidden");
                document.getElementById("fullPhoneDisplay").textContent = phoneNumber;

                // พยายามปิดแท็บทันทีหลังอัปเดตสำเร็จ (บางเบราว์เซอร์อาจไม่อนุญาต)
                setTimeout(() => {
                    window.close();
                    document.body.innerHTML =
                        '<div style="font-family:Prompt,sans-serif;text-align:center;padding:48px 20px;color:#334155">' +
                        '<h2>เปลี่ยนรหัสผ่านเรียบร้อยแล้ว</h2><p>รหัสผ่านใหม่คือ 1234</p><p>สามารถปิดหน้านี้ได้</p></div>';
                }, 900);
            } catch (error) {
                console.error("Supabase update error:", error);
                showError("เกิดข้อผิดพลาดในการเชื่อมต่อหรืออัปเดตฐานข้อมูล: " +
                    (error.message || "กรุณาตรวจสอบการตั้งค่า Supabase"));
            } finally {
                if (!document.getElementById("successCard").classList.contains("hidden")) return;
                submit.disabled = false;
                submit.innerHTML = '<span>ยืนยัน</span><i class="fa-solid fa-arrow-right text-xs"></i>';
            }
        }

        function resetApp() {
            document.getElementById("password").value = "";
            document.getElementById("loginForm").parentElement.classList.remove("hidden");
            document.getElementById("successCard").classList.add("hidden");
            updateLockUI();
            document.getElementById("password").focus();
        }
    </script>
</body>
</html>
