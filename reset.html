<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter & Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Background Mesh Effect */
        .bg-mesh {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(204, 251, 241, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(224, 231, 255, 0.6) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh text-slate-700 min-h-screen flex items-center justify-center p-5">

    <!-- Container หลัก ออกแบบมินิมอลสำหรับมือถือ -->
    <div class="w-full max-w-sm bg-white/80 backdrop-blur-md rounded-3xl p-7 shadow-xl shadow-slate-200/60 border border-slate-100 flex flex-col justify-between min-h-[480px]">
        
        <!-- Header Section -->
        <div class="text-center mt-2">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-teal-50 text-teal-600 rounded-2xl mb-4 border border-teal-100">
                <i class="fa-solid fa-lock text-xl"></i>
            </div>
            <h1 class="text-xl font-medium text-slate-800 mb-1">ยินดีต้อนรับ</h1>
            <p class="text-slate-400 text-xs">กรุณากรอกรหัสผ่านเพื่อดำเนินการต่อ</p>
            
            <!-- แสดงเบอร์โทรศัพท์ในหน้าล็อกอิน -->
            <div id="phoneBadge" class="mt-3 inline-flex items-center gap-2 px-3 py-1.5 bg-slate-100 border border-slate-200/60 rounded-full text-slate-600 text-xs font-mono">
                <i class="fa-solid fa-phone text-[10px] text-teal-600"></i>
                <span id="loginPhoneDisplay" class="font-medium tracking-wide">--</span>
            </div>
        </div>

        <!-- Form Section -->
        <div class="my-auto py-4">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-500 mb-2 pl-1">
                        รหัสผ่าน
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            required 
                            autofocus
                            placeholder="กรอกรหัสผ่าน"
                            class="w-full pl-4 pr-11 py-3.5 bg-slate-50/80 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 text-slate-800 placeholder-slate-400 text-sm transition-all duration-200"
                        >
                        <button 
                            type="button" 
                            onclick="togglePasswordVisibility()" 
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                            aria-label="แสดง/ซ่อนรหัสผ่าน"
                        >
                            <i id="toggleIcon" class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- แสดงข้อความผิดพลาด -->
                <div id="errorMessage" class="hidden text-rose-500 text-xs bg-rose-50/80 border border-rose-100 rounded-xl p-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-sm flex-shrink-0"></i>
                    <span id="errorText">รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง</span>
                </div>

                <!-- ปุ่มเข้าสู่ระบบ -->
                <button 
                    type="submit" 
                    class="w-full py-3.5 bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white font-medium rounded-2xl shadow-md shadow-teal-600/20 transition-all duration-200 flex items-center justify-center gap-2 text-sm mt-2"
                >
                    <span>ยืนยัน</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <!-- หน้าจอสำเร็จ (จะซ่อนไว้ก่อน) -->
        <div id="successCard" class="hidden text-center py-4 my-auto space-y-4">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-50 text-emerald-500 rounded-2xl border border-emerald-100">
                <i class="fa-solid fa-check text-2xl"></i>
            </div>
            <div>
                <h2 class="text-xl font-medium text-slate-800">เข้าสู่ระบบเรียบร้อย</h2>
                <p class="text-xs text-slate-400 mt-1">การยืนยันตัวตนเสร็จสมบูรณ์</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <p class="text-slate-400 text-[11px] mb-1">เบอร์โทรศัพท์ของคุณ</p>
                <p id="fullPhoneDisplay" class="font-mono text-lg font-semibold text-teal-700 tracking-wider">--</p>
            </div>
            <button 
                onclick="resetApp()" 
                class="w-full py-3 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600 font-medium rounded-xl transition-all duration-200 text-xs"
            >
                ย้อนกลับ
            </button>
        </div>

        <!-- Footer -->
        <div class="text-center text-[11px] text-slate-400 pt-3 border-t border-slate-100">
            <p>ระบบรักษาความปลอดภัย</p>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // รหัสผ่านที่กำหนดไว้
        const CORRECT_PASSWORD = "12345678ranya$$$";
        let phoneNumber = "";

        // ดึงค่าเบอร์โทรศัพท์จาก URL Parameter เมื่อเปิดหน้าเว็บขึ้นมาทันที
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            // รองรับทั้ง ?phone= หรือ ?tel= หรือ ?p=
            phoneNumber = urlParams.get('phone') || urlParams.get('tel') || urlParams.get('p') || "";

            // แสดงเบอร์โทรศัพท์บนหน้าแรก
            const loginPhoneDisplay = document.getElementById('loginPhoneDisplay');
            if (phoneNumber) {
                loginPhoneDisplay.textContent = phoneNumber;
            } else {
                loginPhoneDisplay.textContent = "ไม่ระบุเบอร์โทรศัพท์";
            }

            // โฟกัสไปที่ช่องใส่รหัสผ่านทันที
            const passwordInput = document.getElementById('password');
            if (passwordInput) {
                passwordInput.focus();
            }
        };

        // ฟังก์ชันสลับการแสดง/ซ่อนรหัสผ่าน
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // ฟังก์ชันจัดการการส่งฟอร์มเข้าสู่ระบบ
        function handleLogin(event) {
            event.preventDefault();

            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');
            const enteredPassword = passwordInput.value;

            // ตรวจสอบรหัสผ่าน
            if (enteredPassword === CORRECT_PASSWORD) {
                // รหัสผ่านถูกต้อง
                errorMessage.classList.add('hidden');
                showSuccessScreen();
            } else {
                // รหัสผ่านไม่ถูกต้อง
                errorMessage.classList.remove('hidden');
                passwordInput.classList.add('border-rose-500');
                
                // เอฟเฟกต์สั่นเตือน
                passwordInput.classList.add('animate-bounce');
                setTimeout(() => {
                    passwordInput.classList.remove('animate-bounce');
                }, 500);
            }
        }

        // ฟังก์ชันแสดงหน้าจอสำเร็จ
        function showSuccessScreen() {
            const loginForm = document.getElementById('loginForm');
            const successCard = document.getElementById('successCard');
            const fullPhoneDisplay = document.getElementById('fullPhoneDisplay');

            loginForm.parentElement.classList.add('hidden');
            successCard.classList.remove('hidden');

            // แสดงผลเบอร์โทรศัพท์แบบเต็ม
            if (phoneNumber) {
                fullPhoneDisplay.textContent = phoneNumber;
            } else {
                fullPhoneDisplay.textContent = "ไม่พบข้อมูลเบอร์โทรศัพท์";
            }
        }

        // ฟังก์ชันรีเซ็ตกลับหน้าเข้าสู่ระบบ
        function resetApp() {
            document.getElementById('password').value = "";
            document.getElementById('loginForm').parentElement.classList.remove('hidden');
            document.getElementById('successCard').classList.add('hidden');
            document.getElementById('password').focus();
        }
    </script>
</body>
</html>
