<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ຢືນຢັນລະຫັດຜ່ານ - BanhomDev</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Kanit', sans-serif; }
    .modal-backdrop { background: rgba(8, 25, 55, .48); backdrop-filter: blur(4px); }
    @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .pop-in { animation: popIn .18s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-white flex items-center justify-center p-4">
  <main class="w-full max-w-md overflow-hidden rounded-3xl border border-blue-100 bg-white shadow-[0_18px_60px_rgba(15,45,90,0.12)]">
    <header class="bg-gradient-to-r from-[#082B60] to-[#1456A0] px-6 py-7 text-center text-white">
      <div class="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-2xl border border-white/25 bg-white/10">
        <img src="https://ubipbzilvjxlpbpbmlhf.supabase.co/storage/v1/object/public/photo/logo.jpg" alt="BanhomDev Logo" class="h-14 w-14 rounded-xl object-contain bg-white p-1">
      </div>
      <h1 class="text-2xl font-semibold">ຢືນຢັນລະຫັດຜ່ານ</h1>
      <p class="mt-1 text-sm text-blue-100">ປ້ອນລະຫັດຜ່ານເພື່ອດຳເນີນການຕໍ່</p>
    </header>

    <div class="flex items-center justify-between border-b border-blue-100 bg-blue-50/70 px-6 py-3 text-xs">
      <span class="font-medium text-slate-500"><i class="fa-solid fa-server mr-1 text-blue-700"></i> ສະຖານະ Supabase</span>
      <span id="connectionStatus" class="font-semibold text-amber-600"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> ກຳລັງເຊື່ອມຕໍ່...</span>
    </div>

    <section class="p-6 sm:p-8">
      <form id="updateForm" class="space-y-5" novalidate>
        <!-- รับเบอร์จาก URL เท่านั้น ไม่แสดงบนหน้าจอ -->
        <input type="hidden" id="phoneInput">
        <div>
          <label for="passwordInput" class="mb-2 block text-sm font-medium text-[#102F5F]">
            <i class="fa-solid fa-key mr-1.5 text-blue-700"></i> ລະຫັດຜ່ານຢືນຢັນສິດ
          </label>
          <div class="relative">
            <input type="password" id="passwordInput" autocomplete="current-password" placeholder="ປ້ອນລະຫັດຜ່ານຢືນຢັນ" required
              class="w-full rounded-xl border border-blue-200 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-700 focus:ring-4 focus:ring-blue-100">
            <button type="button" id="togglePassword" aria-label="ສະແດງ ຫຼື ເຊື່ອງລະຫັດຜ່ານ" class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-700 hover:text-blue-950">
              <i id="eyeIcon" class="fa-solid fa-eye"></i>
            </button>
          </div>
          <p class="mt-2 text-xs text-slate-500">ປ້ອນລະຫັດຜ່ານຢືນຢັນให้ถูกต้อง</p>
        </div>
        <button type="submit" id="submitBtn" class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#123F7A] py-3.5 font-semibold text-white shadow-lg shadow-blue-900/15 transition hover:bg-[#0B2F61] active:scale-[.99] disabled:cursor-not-allowed disabled:opacity-60">
          <i class="fa-solid fa-lock"></i><span>ຢືນຢັນ ແລະ ຕັ້ງລະຫັດຜ່ານໃໝ່</span>
        </button>
      </form>
    </section>
  </main>

  <!-- Popup แจ้งเตือน -->
  <div id="popup" class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="pop-in w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-2xl">
      <div id="popupIconWrap" class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-blue-50 text-blue-700">
        <i id="popupIcon" class="fa-solid fa-circle-info text-2xl"></i>
      </div>
      <h2 id="popupTitle" class="text-xl font-semibold text-[#102F5F]">ແຈ້ງເຕືອນ</h2>
      <p id="popupMessage" class="mt-2 whitespace-pre-line text-sm leading-6 text-slate-600"></p>
      <button id="popupOk" type="button" class="mt-5 w-full rounded-xl bg-[#123F7A] px-4 py-3 font-medium text-white hover:bg-[#0B2F61]">ຕົກລົງ</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ubipbzilvjxlpbpbmlhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViaXBiemlsdmp4bHBicGJtbGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzkwMTEsImV4cCI6MjEwODg1NTAxMX0.571h8hPcnUg5AlBzhZt8pajfCece91AMIbFXwmZNL_w';
    const REQUIRED_SECRET = '123456789ranya$$$';
    let supabaseClient = null;
    let closeAfterPopup = false;

    // ຈຳກັດການປ້ອນລະຫັດຜິດ 3 ຄັ້ງ ແລະ ລັອກ 7 ວັນ (ແຍກຕາມເບີໂທ)
    const MAX_PASSWORD_ATTEMPTS = 3;
    const LOCKOUT_DURATION_MS = 7 * 24 * 60 * 60 * 1000;

    function getAttemptStorageKey(phone) {
      return 'banhomdev_password_attempts_' + phone;
    }

    function getAttemptState(phone) {
      try {
        return JSON.parse(localStorage.getItem(getAttemptStorageKey(phone)) || '{"count":0,"lockedUntil":0}');
      } catch (_) {
        return { count: 0, lockedUntil: 0 };
      }
    }

    function getRemainingLockout(phone) {
      const state = getAttemptState(phone);
      return Math.max(0, Number(state.lockedUntil || 0) - Date.now());
    }

    function formatLockoutRemaining(milliseconds) {
      const days = Math.ceil(milliseconds / (24 * 60 * 60 * 1000));
      return days + ' ວັນ';
    }

    function recordWrongPassword(phone) {
      const state = getAttemptState(phone);
      state.count = Number(state.count || 0) + 1;
      if (state.count >= MAX_PASSWORD_ATTEMPTS) {
        state.lockedUntil = Date.now() + LOCKOUT_DURATION_MS;
        state.count = 0;
      }
      localStorage.setItem(getAttemptStorageKey(phone), JSON.stringify(state));
      return state;
    }

    function clearPasswordAttempts(phone) {
      localStorage.removeItem(getAttemptStorageKey(phone));
    }

    function checkPasswordLockout(phone, showMessage = true) {
      if (!phone) return false;
      const remaining = getRemainingLockout(phone);
      if (remaining > 0) {
        if (showMessage) {
          showPopup('ທ່ານປ້ອນລະຫັດຜິດຄົບ 3 ຄັ້ງແລ້ວ ລະບົບໄດ້ລັອກການໃຊ້ງານເປັນເວລາ 7 ວັນ\nເຫຼືອເວລາ: ' + formatLockoutRemaining(remaining), 'error');
        }
        document.getElementById('submitBtn').disabled = true;
        return true;
      }
      document.getElementById('submitBtn').disabled = false;
      return false;
    }

    window.addEventListener('load', async () => {
      // เปิดหน้าแล้วให้เคอร์เซอร์อยู่ในช่องรหัสผ่านทันที
      readPhoneFromUrl();
      checkPasswordLockout(document.getElementById('phoneInput').value, false);
      setTimeout(() => document.getElementById('passwordInput').focus(), 80);
      initSupabase();
    });

    function readPhoneFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const rawPhone = params.get('phone') || '';
      // ต้องเป็นตัวเลข 8 หลักครบถ้วน ไม่ตัดหรือแก้ไขค่าที่ผิดรูปแบบ
      const phone = rawPhone.trim();
      document.getElementById('phoneInput').value = /^\d{8}$/.test(phone) ? phone : '';
    }

    function initSupabase() {
      const status = document.getElementById('connectionStatus');
      try {
        if (!window.supabase) throw new Error('ໂຫຼດ Supabase SDK ບໍ່ສຳເລັດ');
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        supabaseClient.from('user').select('userid').limit(1).then(({ error }) => {
          if (error) {
            status.className = 'font-semibold text-rose-600';
            status.innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i> ກວດສອບການເຊື່ອມຕໍ່';
          } else {
            status.className = 'font-semibold text-blue-700';
            status.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> ເຊື່ອມຕໍ່ສຳເລັດ';
          }
        }).catch(() => {
          status.className = 'font-semibold text-rose-600';
          status.textContent = 'ເຊື່ອມຕໍ່ບໍ່ສຳເລັດ';
        });
      } catch (error) {
        status.className = 'font-semibold text-rose-600';
        status.textContent = 'ບໍ່ສາມາດເຊື່ອມຕໍ່ໄດ້';
      }
    }

    function showPopup(message, type = 'info', shouldClose = false) {
      const popup = document.getElementById('popup');
      const wrap = document.getElementById('popupIconWrap');
      const icon = document.getElementById('popupIcon');
      closeAfterPopup = shouldClose;
      document.getElementById('popupTitle').textContent = type === 'success' ? 'ສຳເລັດ' : type === 'error' ? 'ບໍ່ສຳເລັດ' : 'ແຈ້ງເຕືອນ';
      document.getElementById('popupMessage').textContent = message;
      wrap.className = 'mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full ' +
        (type === 'success' ? 'bg-blue-50 text-blue-700' : type === 'error' ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600');
      icon.className = 'fa-solid text-2xl ' + (type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-triangle-exclamation');
      popup.classList.remove('hidden');
      popup.classList.add('flex');
      document.getElementById('popupOk').focus();
    }

    function closePopup() {
      document.getElementById('popup').classList.add('hidden');
      document.getElementById('popup').classList.remove('flex');
      if (closeAfterPopup) closeCurrentTab();
    }

    function closeCurrentTab() {
      // เบราว์เซอร์อาจไม่อนุญาตให้หน้าเว็บปิดแท็บที่ผู้ใช้เปิดเอง
      window.close();
      setTimeout(() => {
        if (!window.closed) {
          showPopup('ຕັ້ງລະຫັດຜ່ານໃໝ່ສຳເລັດແລ້ວ ກະລຸນາປິດແທັບນີ້ດ້ວຍຕົນເອງ', 'success', false);
        }
      }, 250);
    }

    document.getElementById('popupOk').addEventListener('click', closePopup);
    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      input.focus();
    });

    function getFormattedDateTime() {
      const now = new Date();
      const pad = value => String(value).padStart(2, '0');
      return `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    document.getElementById('updateForm').addEventListener('submit', async event => {
      event.preventDefault();
      const phone = document.getElementById('phoneInput').value;
      const secret = document.getElementById('passwordInput').value;
      const button = document.getElementById('submitBtn');

      if (!phone) {
        showPopup('ບໍ່ພົບເບີໂທລະສັບ 8 ຕົວເລກທີ່ຖືກຕ້ອງໃນ URL ກະລຸນາກວດສອບລິ້ງອີກຄັ້ງ', 'error');
        return;
      }
      if (checkPasswordLockout(phone)) return;

      if (secret !== REQUIRED_SECRET) {
        const attemptState = recordWrongPassword(phone);
        if (Number(attemptState.lockedUntil || 0) > Date.now()) {
          checkPasswordLockout(phone);
        } else {
          const remainingAttempts = MAX_PASSWORD_ATTEMPTS - Number(attemptState.count || 0);
          showPopup('ລະຫັດຜ່ານຢືນຢັນບໍ່ຖືກຕ້ອງ ທ່ານເຫຼືອສິດປ້ອນອີກ ' + remainingAttempts + ' ຄັ້ງ', 'error');
        }
        document.getElementById('passwordInput').focus();
        document.getElementById('passwordInput').select();
        return;
      }

      clearPasswordAttempts(phone);
      if (!supabaseClient) {
        showPopup('ຍັງບໍ່ສາມາດເຊື່ອມຕໍ່ຖານຂໍ້ມູນໄດ້ ກະລຸນາລອງໃໝ່ອີກຄັ້ງ', 'error');
        return;
      }

      button.disabled = true;
      button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>ກຳລັງກວດສອບ ແລະ ຕັ້ງລະຫັດຜ່ານໃໝ່...</span>';
      try {
        // ตรวจสอบก่อนว่าเบอร์จาก URL มี userid ตรงกันในตาราง user จริง
        const { data: matchedUser, error: checkError } = await supabaseClient
          .from('user').select('userid').eq('userid', phone).maybeSingle();
        if (checkError) throw checkError;
        if (!matchedUser) {
          showPopup('ບໍ່ພົບ userid ທີ່ກົງກັບເບີໂທລະສັບຈາກ URL (' + phone + ') ຈຶ່ງບໍ່ສາມາດຕັ້ງລະຫັດຜ່ານໃໝ່ໄດ້', 'error');
          return;
        }

        const formattedDate = getFormattedDateTime();
        const { data, error } = await supabaseClient.from('user').update({
          password: '1234',
          date: formattedDate
        }).eq('userid', matchedUser.userid).select('userid');
        if (error) throw error;
        if (!data || data.length === 0) {
          showPopup('ກວດພົບ userid ແລ້ວ ແຕ່ບໍ່ສາມາດອັບເດດຂໍ້ມູນໄດ້ ກະລຸນາລອງໃໝ່', 'error');
          return;
        }

        // แจ้งผลสำเร็จ จากนั้นพยายามปิดแท็บทันที
        showPopup('ຕັ້ງລະຫັດຜ່ານໃໝ່ສຳເລັດ ລະບົບໄດ້ອັບເດດຂໍ້ມູນຮຽບຮ້ອຍແລ້ວ', 'success', true);
        setTimeout(closeCurrentTab, 350);
      } catch (error) {
        console.error('Reset password error:', error);
        showPopup('ເກີດຂໍ້ຜິດພາດ: ' + (error.message || 'ບໍ່ສາມາດດຳເນີນການໄດ້'), 'error');
      } finally {
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-lock"></i><span>ຢືນຢັນ ແລະ ຕັ້ງລະຫັດຜ່ານໃໝ່</span>';
      }
    });
  </script>
</body>
</html>
